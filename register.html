<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #dfeeff);
        color: #1c1c1c;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px 20px;
      }

      .registro-box {
        width: 100%;
        max-width: 500px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(31, 60, 136, 0.12);
        padding: 35px 30px;
      }

      .logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .logo-img {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #1f3c88;
        background: white;
        padding: 3px;
      }

      h2 {
        text-align: center;
        margin: 0 0 25px;
        color: #1f3c88;
      }

      form {
        display: grid;
        gap: 15px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #d7dfe9;
        border-radius: 12px;
        font-size: 1rem;
      }

      button {
        background: #ffb703;
        color: #111;
        border: none;
        border-radius: 12px;
        padding: 15px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .link-back {
        display: block;
        margin-top: 18px;
        text-align: center;
        color: #1f3c88;
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .registro-box {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="registro-box">
      <div class="logo-wrap">
        <img class="logo-img" src="imagen/Logo.jpeg" alt="Logo de la empresa" />
      </div>
      <h2>Crear cuenta</h2>

      <form>
        <input type="text" placeholder="Nombre completo" aria-label="Nombre completo" />
        <input type="email" placeholder="Correo electrónico" aria-label="Correo electrónico" />
        <input type="password" placeholder="Contraseña" aria-label="Contraseña" />
        <button type="submit">Registrarse</button>
      </form>

      <a class="link-back" href="index.html">Volver a la página principal</a>
    </div>
  </body>
</html>
